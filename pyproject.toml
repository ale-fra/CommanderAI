[project]
name = "commanderai"
version = "0.7.0"
description = "AI-powered Commander deck builder from your MTG collection"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pydantic>=2.5",
    "anthropic>=0.40",
    "orjson>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# `commanderai serve`: HTTP API + web UI
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
commanderai = "commanderai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commanderai"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Typer declares options via function-call defaults by design.
"src/commanderai/cli/*" = ["B008"]
